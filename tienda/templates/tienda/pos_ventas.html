{% extends "admin/base_site.html" %} {% block content %}
<div class="pos-container" style="background: #e0e0e0; min-height: 90vh; padding: 10px; font-family: sans-serif;">
    <div class="product-card" style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between;">
            <img src="{% static 'img/box-placeholder.png' %}" style="width: 60px;">
            <div style="flex-grow: 1; margin-left: 15px;">
                <small style="color: gray;">PZA | 7501098612074</small>
                <div style="font-weight: bold; font-size: 1.1rem;">ABATE LENGUAS MADERA 25...</div>
            </div>
            <button style="color: red; border: none; background: none; font-size: 1.5rem;">&times;</button>
        </div>
        
        <div style="display: flex; align-items: center; margin-top: 15px; gap: 10px;">
            <div style="background: #ccc; padding: 10px; border-radius: 4px; flex: 1;">
                <small>Cantidad</small><br><strong>#1.00</strong>
            </div>
            <div style="background: #ccc; padding: 10px; border-radius: 4px; flex: 1;">
                <small>Precio</small><br><strong>$22.00</strong>
            </div>
            <div style="font-size: 1.5rem; font-weight: bold;">$22.00</div>
        </div>
    </div>

    <div style="text-align: center; margin: 20px 0;">
        <span style="font-size: 1.5rem; color: #444;">Total $</span>
        <div style="font-size: 3rem; font-weight: bold;">22.00</div>
    </div>

    <div style="display: flex; justify-content: space-around; background: white; padding: 10px; border-radius: 8px;">
        <label><input type="checkbox"> Impuesto</label>
        <label><input type="checkbox"> Descuento</label>
        <label><input type="checkbox"> Crédito</label>
    </div>

    <div style="margin-top: 15px;">
        <div style="background: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
            <span>Forma Pago</span>
            <span style="background: #ddd; padding: 5px 10px; border-radius: 20px;">TRANSFERENCIA &times;</span>
        </div>
    </div>

    <div style="position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background: #333; color: white; height: 60px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #4a148c;">
            <i class="fas fa-barcode"></i><small>Productos</small>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #e65100;">
            <i class="fas fa-box"></i><small>Inventario</small>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #01579b;">
            <i class="fas fa-concierge-bell"></i><small>Servicios</small>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #3e2723;">
            <i class="fas fa-qrcode"></i><small>Scanner</small>
        </div>
    </div>
</div>
{% endblock %}
